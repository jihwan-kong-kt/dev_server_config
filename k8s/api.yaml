apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          # Jenkins가 아래 줄의 태그를 빌드 번호로 바꿈
          image: dev-server-api:manual
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              value: postgresql://Administrator:1234@10.10.0.40:5432/app_db
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
---
# 맥에서 localhost:30080 으로 들어오는 입구
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: app
spec:
  type: NodePort
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
              